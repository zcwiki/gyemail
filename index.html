<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gov.Yun Email</title>

<!-- SEO -->
<meta name="description" content="Gov.Yun Email">
<meta name="keywords" content="Gov.Yun Email">

<!-- Open Graph -->
<meta property="og:title" content="Gov.Yun Email">
<meta property="og:description" content="Gov.Yun Email">
<meta property="og:type" content="website">
<meta property="og:url" content="/">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Gov.Yun Email">
<meta name="twitter:description" content="Gov.Yun Email">
<style>
html, body { margin:0; padding:0; min-height:100vh; }
a { text-decoration:none; color:#007aff; }
a:hover { text-decoration:none; }
html, body {
  margin: 0;
  padding: 0;
  min-height: 100dvh; /* dvh = dynamic viewport height，会排除浏览器 UI */
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  box-sizing: border-box;
  background-color: #f2f2f2;
  font-family: 'PingFang SC','Helvetica Neue',Arial,sans-serif;
}
.container { display:flex; flex-direction:column; align-items:center; width:100%; max-width:500px; padding:20px; }
.header { display:flex; flex-direction:column; align-items:center; margin-bottom:30px; }
.avatar { width:80px; height:80px; border-radius:50%; object-fit:cover; margin-bottom:8px; transition:transform 0.6s ease; }
h1.name { font-size:1.8rem; font-weight:700; color:#333; margin:0; line-height:1.2; }
.card { width:100%; background-color:#1e1e1e; color:#d4d4d4; border-radius:15px; box-shadow:0 6px 20px rgba(0,0,0,0.15); padding:25px; box-sizing:border-box; font-size:1rem; white-space:pre-wrap; overflow-x:auto; font-family:inherit; }
.json-key { color:#4ec9b0; }
.json-string { color:#ce9178; }
.json-number { color:#569cd6; }
.friend-links { display:flex; justify-content:center; gap:20px; margin:20px 0 10px; flex-wrap:wrap; font-size:1rem; }
.footer-container { text-align:center; font-size:0.85rem; color:#555; }
.footer-container div { margin:4px 0; }
@media (max-width:480px) {
  .avatar { width:60px; height:60px; }
  h1.name { font-size:1.5rem; }
  .card { font-size:0.95rem; padding:15px; }
  .friend-links { gap:15px; }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1 class="name">Gov.Yun Email</h1>
  </div>

  <div class="card" id="jsonCard"></div>

  <div class="friend-links">
  <a href='https://icp.gov.moe/?keyword=20080808' target='_blank'>萌ICP备20080808号</a>
    <a href='https://icp.gov.moe/moemail/' target='_blank'>申请萌邮</a>
  </div>
</div>

<script>

// JSON 数据
const contactData = {
  "域名": "Gov.Yun",
  "服务": "MoeMail",
  "说明": "Gov.Yun Email目前已经加入萌邮服务。你可以在萌邮开放申请阶段使用Gov.Yun Email，使用本邮箱需遵守萌邮申请要求，请勿滥用。"
};

// JSON 高亮函数
function syntaxHighlight(json) {
  if (typeof json != 'string') json = JSON.stringify(json,null,2);
  json = json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b\d+\b)/g, function(match){
    let cls='json-number';
    if(/^"/.test(match)) cls=/:$/.test(match)?'json-key':'json-string';
    return '<span class="'+cls+'">'+match+'</span>';
  });
}

document.getElementById('jsonCard').innerHTML = syntaxHighlight(contactData);

// 头像旋转
const avatar = document.querySelector('.avatar');
let isRotating = false;

avatar.addEventListener('mouseenter',()=>{if(!isRotating) avatar.style.transform='rotate(360deg)';});
avatar.addEventListener('mouseleave',()=>{if(!isRotating) avatar.style.transform='rotate(0deg)';});
avatar.addEventListener('click',()=>{
  if(!isRotating){
    isRotating=true;
    avatar.style.transform='rotate(360deg)';
    setTimeout(()=>{avatar.style.transform='rotate(0deg)'; isRotating=false;},600);
  }
});
document.body.addEventListener('click',(event)=>{if(!avatar.contains(event.target)){avatar.style.transform='rotate(0deg)'; isRotating=false;}});
</script>

</body>
</html>
